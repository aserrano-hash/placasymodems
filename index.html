<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Modelo 3D</title>

  <!-- Importar el visor 3D de Google -->
  <script type="module" src="placas/asus_z170-p_motherboard.gltf"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #333;
      font-size: 1.8rem;
    }

    p {
      color: #666;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Visor 3D */
    model-viewer {
      width: 100%;
      height: 450px;
      background-color: #fbfbfb;
      --poster-color: transparent;
    }

    .info-card {
      padding: 20px;
      width: 100%;
      border-top: 1px solid #eee;
    }

    .info-card h2 {
      font-size: 1.2rem;
      color: #2c3e50;
      margin-bottom: 8px;
    }

    .info-card p {
      color: #555;
      line-height: 1.5;
    }

    /* Botón de Realidad Aumentada para móviles */
    .ar-button {
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Visualizador 3D</h1>
    <p>Interactúa con el modelo 3D directamente desde tu navegador</p>
  </header>

  <div class="container">
    <!-- Componente del Visor 3D -->
    <model-viewer 
      src="placas/asus_z170-p_motherboard.gltf" 
      alt="Modelo 3D interactivo"
      camera-controls 
      auto-rotate 
      ar 
      shadow-intensity="1">
    </model-viewer>

    <div class="info-card">
      <h2>Detalles del Modelo</h2>
      <p>Arrastra para rotar, usa la rueda del ratón o pellizca para hacer zoom. Si accedes desde un dispositivo móvil compatible, presiona el botón de AR para proyectarlo en tu espacio.</p>
    </div>
  </div>

</body>
</html>
